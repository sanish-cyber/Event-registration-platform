<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - College Event Registration System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="particleCanvas"></canvas>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" style="color: var(--primary); font-size: 2rem;">
                    <i class="fas fa-graduation-cap"></i>
                </a>
                <h1>Create Account</h1>
                <p>Join us to discover and register for events</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone (Optional)</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+1 234 567 890">
                </div>

                <div class="form-group">
                    <label class="form-label">Department (Optional)</label>
                    <input type="text" class="form-control" id="department" placeholder="Computer Science">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Min. 6 characters" required minlength="6">
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Register as</label>
                    <select class="form-control" id="role">
                        <option value="attendee">Attendee (Participant)</option>
                        <option value="organizer">Event Organizer</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Redirect if already logged in
        auth.redirectIfLoggedIn();

        async function handleRegister(event) {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }

            const userData = {
                email: document.getElementById('email').value,
                password: password,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                department: document.getElementById('department').value,
                role: document.getElementById('role').value
            };

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner" style="width: 1.5rem; height: 1.5rem;"></div>';

            try {
                await api.auth.register(userData);
                showToast('Registration successful! Please login.', 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (error) {
                showToast(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<span>Create Account</span>';
            }
        }
    </script>
    <script src="js/3d-effects.js"></script>
</body>
</html>
